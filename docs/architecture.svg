<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">FresherAI service architecture</title>
  <desc id="desc">Vercel frontend calls an Express gateway, which routes to independent application services. Redis provides cache, queue, sessions, rate limits, and event streams; MongoDB stores application data. Resume jobs use BullMQ and event consumers update progress and roadmap data.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <rect width="1200" height="660" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">FresherAI architecture</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="70" y="105" width="230" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="140" font-size="20" font-weight="700" fill="#1e3a8a">React + Vite</text><text x="185" y="165" font-size="15" fill="#334155">Frontend · Vercel / local</text>
    <rect x="390" y="105" width="250" height="80" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="515" y="140" font-size="20" font-weight="700" fill="#4c1d95">Express API gateway</text><text x="515" y="165" font-size="15" fill="#334155">Auth · CORS · rate limits · proxy</text>
    <path d="M300 145 H380" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="340" y="128" font-size="13" fill="#475569">HTTPS</text>
    <rect x="720" y="94" width="420" height="360" rx="18" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="930" y="126" font-size="19" font-weight="700" fill="#0f172a">Node.js services</text>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"><rect x="755" y="150" width="170" height="55" rx="10"/><rect x="950" y="150" width="155" height="55" rx="10"/><rect x="755" y="225" width="170" height="55" rx="10"/><rect x="950" y="225" width="155" height="55" rx="10"/><rect x="755" y="300" width="170" height="55" rx="10"/><rect x="950" y="300" width="155" height="55" rx="10"/><rect x="850" y="375" width="170" height="55" rx="10"/></g>
    <g font-size="16" fill="#14532d"><text x="840" y="184">Auth · Resume</text><text x="1028" y="184">Interview</text><text x="840" y="259">Roadmap · Progress</text><text x="1028" y="259">Practice</text><text x="840" y="334">Billing</text><text x="1028" y="334">Career</text><text x="935" y="409">Background workers</text></g>
    <path d="M640 145 H710" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="675" y="128" font-size="13" fill="#475569">Internal routes</text>
    <rect x="115" y="300" width="380" height="135" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="305" y="335" font-size="20" font-weight="700" fill="#7c2d12">Redis</text><text x="305" y="365" font-size="16" fill="#431407">Cache · rate limits · BullMQ jobs</text><text x="305" y="392" font-size="16" fill="#431407">Redis Streams · sessions</text>
    <rect x="575" y="505" width="380" height="105" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="765" y="542" font-size="20" font-weight="700" fill="#713f12">MongoDB</text><text x="765" y="572" font-size="16" fill="#422006">Users · resumes · attempts · ledgers</text>
    <path d="M515 190 C515 255 395 255 395 290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="450" y="245" font-size="13" fill="#475569">cache / enqueue</text>
    <path d="M720 260 C650 260 650 340 505 340" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/><text x="615" y="314" font-size="13" fill="#475569">jobs / events</text>
    <path d="M790 455 V495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="845" y="483" font-size="13" fill="#475569">read / write</text>
  </g>
</svg>
